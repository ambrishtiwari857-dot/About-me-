<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambrish Tiwari | Official</title>
    <meta name="description" content="Digital Content Creator, Gamer, and Memer based in Varanasi.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(45deg, #38bdf8, #818cf8); transition: 0.3s; }
        .btn-gradient:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

    <div class="max-w-md w-full glass rounded-[2.5rem] p-8 text-center shadow-2xl">
        <div class="relative w-32 h-32 mx-auto mb-6">
            <img src="myphoto.jpg" alt="Ambrish Tiwari" class="w-full h-full rounded-full border-4 border-sky-500 object-cover shadow-lg">
            <div class="absolute bottom-1 right-1 bg-green-500 w-6 h-6 rounded-full border-4 border-[#0f172a]"></div>
        </div>
        
        <h1 class="text-3xl font-extrabold mb-1 tracking-tight">Ambrish Tiwari</h1>
        <p class="text-sky-400 font-semibold mb-4 text-lg">@iamambrishh</p>
        
        <div class="flex justify-center gap-2 mb-6">
            <span class="bg-sky-500/10 text-sky-400 text-[10px] uppercase font-bold px-3 py-1 rounded-lg border border-sky-500/20">Gamer</span>
            <span class="bg-indigo-500/10 text-indigo-400 text-[10px] uppercase font-bold px-3 py-1 rounded-lg border border-indigo-500/20">Memer</span>
            <span class="bg-purple-500/10 text-purple-400 text-[10px] uppercase font-bold px-3 py-1 rounded-lg border border-purple-500/20">Varanasi</span>
        </div>

        <p class="text-gray-400 text-sm leading-relaxed mb-8 px-2">
            Digital Content Creator & Gaming Professional based in Varanasi. Specializing in viral meme marketing and trending entertainment.
        </p>

        <div class="glass rounded-2xl p-4 mb-8">
            <p class="text-[10px] uppercase text-gray-500 font-bold mb-3 tracking-widest">Now Playing</p>
            <audio id="bgMusic" src="music.mp3"></audio>
            <div class="flex items-center justify-center gap-4">
                <button onclick="document.getElementById('bgMusic').play()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20">
                    <i class="fas fa-play text-sky-400"></i>
                </button>
                <button onclick="document.getElementById('bgMusic').pause()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20">
                    <i class="fas fa-pause text-red-400"></i>
                </button>
            </div>
        </div>

        <div class="space-y-3">
            <a href="https://instagram.com/iamambrishh" target="_blank" class="flex items-center justify-between w-full p-4 glass rounded-2xl hover:bg-white/5 transition-all group">
                <span class="flex items-center gap-3 font-medium"><i class="fab fa-instagram text-pink-500 text-xl"></i> Instagram</span>
                <i class="fas fa-external-link-alt text-gray-600 text-xs group-hover:text-white"></i>
            </a>
            <a href="https://facebook.com/virux" target="_blank" class="flex items-center justify-between w-full p-4 glass rounded-2xl hover:bg-white/5 transition-all group">
                <span class="flex items-center gap-3 font-medium"><i class="fab fa-facebook text-blue-500 text-xl"></i> Facebook</span>
                <i class="fas fa-external-link-alt text-gray-600 text-xs group-hover:text-white"></i>
            </a>
        </div>
    </div>

    <footer class="mt-12 text-gray-600 text-[10px] font-medium tracking-widest uppercase">
        &copy; 2026 Ambrish Tiwari | Official Portfolio
    </footer>

</body>
</html>
